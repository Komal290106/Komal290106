<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 16" width="288" shape-rendering="crispEdges">
  <!-- ground line -->
  <rect x="1" y="13" width="26" height="1" fill="#2B2140"/>
  <!-- tail -->
  <rect x="3" y="11" width="3" height="2" fill="#C084FC"/>
  <rect x="2" y="10" width="1" height="2" fill="#C084FC"/>
  <!-- body -->
  <rect x="6" y="8" width="18" height="5" fill="#E5B8FF"/>
  <rect x="8" y="7" width="14" height="1" fill="#E5B8FF"/>
  <!-- stripes -->
  <rect x="10" y="7" width="1" height="2" fill="#C084FC"/>
  <rect x="13" y="7" width="1" height="2" fill="#C084FC"/>
  <rect x="16" y="7" width="1" height="2" fill="#C084FC"/>
  <!-- head -->
  <rect x="20" y="8" width="7" height="5" fill="#E5B8FF"/>
  <!-- ears -->
  <rect x="20" y="6" width="2" height="2" fill="#E5B8FF"/>
  <rect x="25" y="6" width="2" height="2" fill="#E5B8FF"/>
  <rect x="21" y="7" width="1" height="1" fill="#FF9ECF"/>
  <rect x="25" y="7" width="1" height="1" fill="#FF9ECF"/>
  <!-- closed eyes + nose -->
  <rect x="21" y="10" width="2" height="1" fill="#2B2140"/>
  <rect x="24" y="10" width="2" height="1" fill="#2B2140"/>
  <rect x="23" y="11" width="1" height="1" fill="#FF9ECF"/>
  <!-- breathing -->
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0.4;0 0" dur="2.5s" repeatCount="indefinite"/>
  <!-- floating zzz -->
  <g font-family="monospace" font-weight="bold" fill="#C084FC">
    <text x="28" y="6" font-size="3">z
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -2" dur="3s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="4" font-size="3.5">z
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="32" y="2.5" font-size="4">Z
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -2" dur="3s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
